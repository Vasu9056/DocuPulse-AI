name: 🚀 Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PRODUCTION_URL: "https://docupulse-ai.onrender.com"
  LOCAL_URL: "http://localhost:3001"

jobs:

  # ==================================================================
  # JOB 1 — LINT / STATIC VALIDATION
  # ==================================================================
  lint:
    name: 🔍 Lint & Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --ignore-scripts

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 🔍 Validate JavaScript Syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Validating JavaScript syntax..."
          ERRORS=0
          FILES=0

          while IFS= read -r -d '' file; do
            FILES=$((FILES + 1))
            if node --check "$file"; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(
            find . \
              -type f \
              -name "*.js" \
              -not -path "./node_modules/*" \
              -not -path "./coverage/*" \
              -print0
          )

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Files checked : $FILES"
          echo "Syntax errors : $ERRORS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$FILES" -eq 0 ]; then
            echo "❌ No JavaScript files found"
            exit 1
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Syntax validation failed"
            exit 1
          fi

          echo "✅ Syntax validation passed"

  # ==================================================================
  # JOB 2 — SECURITY
  # ==================================================================
  security:
    name: 🛡️ Security Audit
    needs: lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --ignore-scripts

      - name: 🛡️ Run npm Security Audit
        run: |
          set -euo pipefail
          echo "🔍 Running npm security audit..."
          npm audit --audit-level=high --omit=dev || true
          echo "✅ Security audit step completed"

      - name: 🔐 Scan Backend Source for Secrets
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          echo "🔐 Scanning backend source..."
          FOUND=0
          PATTERNS=(
            'sk-[a-zA-Z0-9]{20,}'
            'AKIA[A-Z0-9]{16}'
            'ghp_[a-zA-Z0-9]{36}'
            'github_pat_[a-zA-Z0-9_]{20,}'
            'xox[baprs]-[a-zA-Z0-9-]{10,}'
            'AIza[a-zA-Z0-9_-]{30,}'
          )

          TARGETS=()
          [ -d "backend/src" ] && TARGETS+=("backend/src")
          [ -f "backend/server.js" ] && TARGETS+=("backend/server.js")

          for PATTERN in "${PATTERNS[@]}"; do
            if grep -RInE \
              --exclude-dir=node_modules \
              --exclude-dir=coverage \
              --exclude="*.lock" \
              --exclude=".env*" \
              "$PATTERN" \
              "${TARGETS[@]}" 2>/dev/null; then
              echo "❌ Potential hardcoded secret detected"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "❌ SECURITY CHECK FAILED: Move secrets to environment variables."
            exit 1
          fi
          echo "✅ No known secret patterns detected"

      - name: 🔒 Verify Environment Files Are Not Tracked
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          TRACKED_ENV="$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)"
          if [ -n "$TRACKED_ENV" ]; then
            echo "❌ Environment files are tracked: $TRACKED_ENV"
            exit 1
          fi
          echo "✅ No environment files are tracked"

  # ==================================================================
  # JOB 3 — TESTS
  # ==================================================================
  test:
    name: 🧪 Backend Tests
    needs: security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      PORT: 3001

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --ignore-scripts

      - name: 🌐 Start Backend & Run Smoke Tests
        shell: bash
        run: |
          set -Eeuo pipefail
          SERVER_PID=""
          cleanup() {
            if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            echo "✅ Cleanup completed"
          }
          trap cleanup EXIT

          node server.js > /tmp/backend.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "${LOCAL_URL}/" || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "❌ Backend failed to start"
            cat /tmp/backend.log
            exit 1
          fi
          echo "✅ Backend is ready. Testing endpoints..."

          test_endpoint() {
            STATUS=$(curl -s -o /tmp/api-response -w "%{http_code}" --max-time 10 "${LOCAL_URL}$1" || true)
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ GET $1 → 200"
            else
              echo "  ❌ GET $1 → $STATUS"
              exit 1
            fi
          }
          test_endpoint "/"
          test_endpoint "/api/doc-stores"
          test_endpoint "/api/scraper/health"
          test_endpoint "/api/breaking-diff"
          echo "✅ All local smoke tests passed"

      - name: 📦 Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs-${{ github.sha }}
          path: /tmp/backend.log
          if-no-files-found: ignore
          retention-days: 7

  # ==================================================================
  # JOB 4 — PRODUCTION DEPLOYMENT & VERIFICATION
  # ==================================================================
  deploy:
    name: 🚀 Verify Production Deployment
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: ⏳ Wait for Production Availability
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "⏳ Checking Render production health..."
          for i in {1..30}; do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 15 "${PRODUCTION_URL}/" || true)
            echo "Attempt $i/30 → HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production endpoint is LIVE"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Production endpoint timeout"
          exit 1

      - name: 🏥 Production API Health Checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test_endpoint() {
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 15 "${PRODUCTION_URL}$1" || true)
            if [ "$STATUS" = "200" ]; then
              echo "  ✅ GET $1 → 200"
            else
              echo "  ❌ GET $1 → $STATUS"
              exit 1
            fi
          }
          test_endpoint "/"
          test_endpoint "/api/doc-stores"
          test_endpoint "/api/scraper/health"
          test_endpoint "/api/breaking-diff"
          echo "✅ All production health checks passed"