name: 🚀 Backend CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PRODUCTION_URL: https://docupulse-ai.onrender.com
  LOCAL_URL: http://localhost:3001

jobs:

  # ====================================================================
  # JOB 1: Lint & Validate Backend
  # ====================================================================
  lint:
    name: 🔍 Lint & Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      # --------------------------------------------------------------
      # ESLint - mandatory
      # --------------------------------------------------------------
      - name: 🧹 Run ESLint
        run: npm run lint

      # --------------------------------------------------------------
      # JavaScript syntax validation
      # --------------------------------------------------------------
      - name: 🔍 Check JavaScript Syntax
        shell: bash
        run: |
          echo "🔍 Validating JavaScript syntax..."

          ERRORS=0
          FILES=0

          while IFS= read -r file; do
            FILES=$((FILES + 1))

            if node --check "$file"; then
              echo "  ✅ $file"
            else
              echo "  ❌ $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(
            find . \
              -type f \
              -name "*.js" \
              -not -path "./node_modules/*" \
              -not -path "./coverage/*"
          )

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Files checked : $FILES"
          echo "Syntax errors : $ERRORS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$FILES" -eq 0 ]; then
            echo "❌ No JavaScript files found"
            exit 1
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Syntax validation failed"
            exit 1
          fi

          echo "✅ All JavaScript files passed syntax validation"

      # --------------------------------------------------------------
      # TypeScript validation if applicable
      # --------------------------------------------------------------
      - name: 🔤 TypeScript Validation
        shell: bash
        run: |
          if [ -f "tsconfig.json" ]; then
            echo "🔍 TypeScript configuration detected"
            npx tsc --noEmit
            echo "✅ TypeScript validation passed"
          else
            echo "ℹ️ TypeScript not detected - skipping"
          fi


  # ====================================================================
  # JOB 2: Security Audit
  # ====================================================================
  security:
    name: 🛡️ Security Audit
    needs: lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      # --------------------------------------------------------------
      # npm audit - BLOCKING
      # --------------------------------------------------------------
      - name: 🛡️ Run npm Security Audit
        run: |
          echo "🔍 Running npm security audit..."
          npm audit --audit-level=high
          echo "✅ No high/critical vulnerabilities detected"

      # --------------------------------------------------------------
      # Secret scanning
      # --------------------------------------------------------------
      - name: 🔐 Scan Backend Source for Secrets
        working-directory: .
        shell: bash
        run: |
          echo "🔐 Scanning backend source for hardcoded secrets..."

          FOUND=0

          PATTERNS=(
            'sk-[a-zA-Z0-9]{20,}'
            'AKIA[A-Z0-9]{16}'
            'ghp_[a-zA-Z0-9]{36}'
            'github_pat_[a-zA-Z0-9_]{20,}'
            'xox[baprs]-[a-zA-Z0-9-]{10,}'
            'AIza[a-zA-Z0-9_-]{30,}'
          )

          for PATTERN in "${PATTERNS[@]}"; do
            if grep -RInE \
              --exclude-dir=node_modules \
              --exclude-dir=coverage \
              --exclude="*.lock" \
              --exclude=".env*" \
              "$PATTERN" \
              backend/src \
              backend/server.js 2>/dev/null; then

              echo "❌ Potential hardcoded secret detected!"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ SECURITY CHECK FAILED"
            echo "Move secrets to environment variables."
            exit 1
          fi

          echo "✅ No known hardcoded secret patterns detected"

      # --------------------------------------------------------------
      # Verify environment files are not tracked
      # --------------------------------------------------------------
      - name: 🔒 Verify Environment Files Are Not Tracked
        working-directory: .
        shell: bash
        run: |
          echo "🔍 Checking tracked environment files..."

          TRACKED_ENV=$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)

          if [ -n "$TRACKED_ENV" ]; then
            echo "❌ CRITICAL: Environment files are tracked:"
            echo "$TRACKED_ENV"
            exit 1
          fi

          echo "✅ No environment files are tracked"

      # --------------------------------------------------------------
      # Verify .env is gitignored
      # --------------------------------------------------------------
      - name: 🔒 Verify .env Is Gitignored
        working-directory: .
        shell: bash
        run: |
          echo "🔍 Checking .env protection..."

          ROOT_IGNORE=0
          BACKEND_IGNORE=0

          if [ -f ".gitignore" ] &&
             grep -Eq '(^|/)\.env($|[./*])' .gitignore; then
            ROOT_IGNORE=1
          fi

          if [ -f "backend/.gitignore" ] &&
             grep -Eq '(^|/)\.env($|[./*])' backend/.gitignore; then
            BACKEND_IGNORE=1
          fi

          if [ "$ROOT_IGNORE" -eq 1 ] || [ "$BACKEND_IGNORE" -eq 1 ]; then
            echo "✅ .env is protected by .gitignore"
          else
            echo "❌ .env is not properly gitignored"
            exit 1
          fi


  # ====================================================================
  # JOB 3: Backend Tests & Local API Smoke Tests
  # ====================================================================
  test:
    name: 🧪 Test Services & API
    needs: security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      PORT: 3001

    steps:

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Ensure cURL & tools available
        run: |
          which curl || (sudo apt-get update && sudo apt-get install -y curl)

      # --------------------------------------------------------------
      # Validate backend modules
      # --------------------------------------------------------------
      - name: 🧪 Validate Backend Service Modules
        run: |
          node <<'NODE'
          const modules = [
            { name: "Config", path: "./src/config" },
            { name: "API Routes", path: "./src/routes" },
            { name: "BrightData Svc", path: "./src/services/brightdata.service" },
            { name: "Vector Svc", path: "./src/services/vector.service" },
            { name: "RAG Svc", path: "./src/services/rag.service" }
          ];

          console.log("");
          console.log("🧪 Module Validation Report");
          console.log("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");

          let passed = 0;
          let failed = 0;

          for (const module of modules) {
            try {
              require(module.path);
              console.log(`  ✅ ${module.name.padEnd(20)} ${module.path}`);
              passed++;
            } catch (error) {
              console.error(`  ❌ ${module.name.padEnd(20)} ${error.message}`);
              failed++;
            }
          }

          console.log("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
          console.log(
            `Total: ${passed + failed} | ` +
            `Passed: ${passed} | ` +
            `Failed: ${failed}`
          );

          if (failed > 0) {
            process.exit(1);
          }
          NODE

      # --------------------------------------------------------------
      # Start backend and run local API smoke tests
      # --------------------------------------------------------------
      - name: 🌐 Start Backend & Run API Smoke Tests
        shell: bash
        run: |
          set -u

          SERVER_PID=""

          cleanup() {
            echo ""
            echo "🧹 Cleaning up backend process..."

            if [ -n "${SERVER_PID:-}" ] &&
               kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi

            echo "✅ Cleanup completed"
          }

          trap cleanup EXIT

          echo "🚀 Starting backend..."

          node server.js > /tmp/backend.log 2>&1 &
          SERVER_PID=$!

          echo "Backend PID: $SERVER_PID"
          echo "⏳ Waiting for backend to become ready..."

          READY=0

          for i in {1..30}; do

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "❌ Backend process exited unexpectedly"
              echo ""
              echo "📄 Backend logs:"
              cat /tmp/backend.log
              exit 1
            fi

            STATUS=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 3 \
              "${LOCAL_URL}/" || true)

            echo "Attempt $i/30 → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo ""
            echo "❌ Backend failed to become ready"
            echo ""
            echo "📄 Backend logs:"
            cat /tmp/backend.log
            exit 1
          fi

          echo "✅ Backend is ready"

          echo ""
          echo "🌐 API Endpoint Smoke Tests"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          PASSED=0
          FAILED=0

          test_endpoint() {
            local METHOD="$1"
            local PATH="$2"
            local EXPECTED="$3"
            local DATA="${4:-}"

            local STATUS

            if [ "$METHOD" = "GET" ]; then
              STATUS=$(curl \
                -s \
                -o /tmp/api-response \
                -w "%{http_code}" \
                --max-time 15 \
                "${LOCAL_URL}${PATH}" || true)
            else
              STATUS=$(curl \
                -s \
                -o /tmp/api-response \
                -w "%{http_code}" \
                --max-time 15 \
                -X "$METHOD" \
                -H "Content-Type: application/json" \
                -d "$DATA" \
                "${LOCAL_URL}${PATH}" || true)
            fi

            printf "  %-6s %-30s → %-3s" "$METHOD" "$PATH" "$STATUS"

            if [ "$STATUS" = "$EXPECTED" ]; then
              echo " ✅"
              PASSED=$((PASSED + 1))
            else
              echo " ❌ expected $EXPECTED"
              FAILED=$((FAILED + 1))

              echo "     Response:"
              head -c 500 /tmp/api-response 2>/dev/null || true
              echo ""
            fi
          }

          test_endpoint "GET" "/" "200"
          test_endpoint "GET" "/api/doc-stores" "200"
          test_endpoint "GET" "/api/scraper/health" "200"
          test_endpoint "GET" "/api/breaking-diff" "200"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Total: $((PASSED + FAILED))"
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          echo ""

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Local API smoke tests failed"
            exit 1
          fi

          echo "✅ All local API smoke tests passed"


  # ====================================================================
  # JOB 4: Production Deployment Verification
  # ====================================================================
  deploy:
    name: 🚀 Verify Production Deployment
    needs: test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: 🚀 Render Deployment Started
        run: |
          echo "========================================================"
          echo "🚀 Backend CI passed"
          echo ""
          echo "⚙️ Render will deploy main automatically"
          echo "🌐 Production: ${{ env.PRODUCTION_URL }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "========================================================"

      - name: 🌐 Ensure cURL & tools available
        run: |
          which curl || (sudo apt-get update && sudo apt-get install -y curl)

      # --------------------------------------------------------------
      # Wait for production to become available
      # --------------------------------------------------------------
      - name: ⏳ Wait for Production Deployment
        shell: bash
        run: |
          echo "⏳ Waiting for Render production deployment..."

          MAX_ATTEMPTS=30
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

            STATUS=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 15 \
              "${PRODUCTION_URL}/" || true)

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS → HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "✅ Production service is responding"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))

            if [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; then
              sleep 10
            fi

          done

          echo ""
          echo "❌ Production service did not become healthy"
          exit 1

      # --------------------------------------------------------------
      # Production API health checks
      # --------------------------------------------------------------
      - name: 🏥 Production API Health Check
        shell: bash
        run: |
          echo "🏥 Running production API health checks..."
          echo ""

          PASSED=0
          FAILED=0

          test_endpoint() {
            local PATH="$1"
            local EXPECTED="$2"

            local STATUS

            STATUS=$(curl \
              -L \
              -s \
              -o /tmp/production-response \
              -w "%{http_code}" \
              --max-time 20 \
              "${PRODUCTION_URL}${PATH}" || true)

            if [ "$STATUS" = "$EXPECTED" ]; then
              echo "  ✅ GET $PATH → $STATUS"
              PASSED=$((PASSED + 1))
            else
              echo "  ❌ GET $PATH → $STATUS (expected $EXPECTED)"
              FAILED=$((FAILED + 1))

              echo "     Response:"
              head -c 500 /tmp/production-response 2>/dev/null || true
              echo ""
            fi
          }

          test_endpoint "/" "200"
          test_endpoint "/api/doc-stores" "200"
          test_endpoint "/api/scraper/health" "200"
          test_endpoint "/api/breaking-diff" "200"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Production API health check FAILED"
            exit 1
          fi

          echo "✅ All production API health checks passed"

      # --------------------------------------------------------------
      # Verify production root response
      # --------------------------------------------------------------
      - name: 📡 Verify Production API Response
        shell: bash
        run: |
          echo "📡 Checking production API response..."

          BODY=$(curl \
            -L \
            -sS \
            --max-time 20 \
            "${PRODUCTION_URL}/")

          if [ -z "$BODY" ]; then
            echo "❌ Production API returned an empty response"
            exit 1
          fi

          echo ""
          echo "📄 API Response:"
          echo "$BODY" | head -c 500
          echo ""
          echo ""

          if echo "$BODY" | grep -q '"status":"online"'; then
            echo "✅ API status: online"
          else
            echo "❌ API status is not online"
            exit 1
          fi

          if echo "$BODY" | grep -q '"service":"DocuPulse AI Backend API"'; then
            echo "✅ Service name verified"
          else
            echo "❌ Service name not verified"
            exit 1
          fi

      # --------------------------------------------------------------
      # Final success
      # --------------------------------------------------------------
      - name: 🎉 Production Deployment Verified
        run: |
          echo ""
          echo "========================================================"
          echo "🎉 PRODUCTION DEPLOYMENT VERIFIED"
          echo "========================================================"
          echo ""
          echo "📡 URL: ${{ env.PRODUCTION_URL }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo ""
          echo "✅ ESLint passed"
          echo "✅ JavaScript syntax validation passed"
          echo "✅ TypeScript validation passed"
          echo "✅ npm security audit passed"
          echo "✅ Secret scan passed"
          echo "✅ .env protection passed"
          echo "✅ Service module validation passed"
          echo "✅ Local API smoke tests passed"
          echo "✅ Render deployment is healthy"
          echo "✅ Production API health checks passed"
          echo "✅ Production API response verified"
          echo ""
          echo "🚀 DocuPulse AI backend is LIVE!"
          echo "========================================================"