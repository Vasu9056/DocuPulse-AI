name: 🚀 Backend CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  # ====================================================================
  # JOB 1: Lint & Validate Backend Code
  # ====================================================================
  lint:
    name: 🔍 Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧹 Check Code Syntax (No Runtime Errors)
        working-directory: ./backend
        run: node --check server.js

  # ====================================================================
  # JOB 2: Test All Backend Modules & Services
  # ====================================================================
  test:
    name: 🧪 Test Backend Services
    needs: lint
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3001

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Validate All Service Modules
        working-directory: ./backend
        run: |
          node -e "
            const modules = [
              './src/config',
              './src/routes',
              './src/services/brightdata.service',
              './src/services/vector.service',
              './src/services/rag.service'
            ];
            let passed = 0;
            let failed = 0;
            modules.forEach(mod => {
              try {
                require(mod);
                console.log('  ✅ ' + mod);
                passed++;
              } catch (err) {
                console.error('  ❌ ' + mod + ': ' + err.message);
                failed++;
              }
            });
            console.log('');
            console.log('Results: ' + passed + ' passed, ' + failed + ' failed');
            if (failed > 0) process.exit(1);
          "

      - name: 🌐 Verify Express Server Boots Successfully
        working-directory: ./backend
        run: |
          timeout 8 node -e "
            const app = require('./server');
            const server = app.listen(3099, () => {
              console.log('✅ Express server booted on port 3099');
              server.close(() => {
                console.log('✅ Server shutdown clean');
                process.exit(0);
              });
            });
          " || true

  # ====================================================================
  # JOB 3: Deploy to Render (Auto-triggered via GitHub webhook)
  # ====================================================================
  deploy:
    name: 🚀 Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Render Auto-Deploy Triggered
        run: |
          echo "========================================================"
          echo "🚀 Backend CI passed! Render auto-deploys from GitHub."
          echo "📡 Live URL: https://docupulse-ai.onrender.com"
          echo "📡 Health:   https://docupulse-ai.onrender.com/api/health"
          echo "========================================================"
