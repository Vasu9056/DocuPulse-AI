name: DocuPulse AI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # 1. TEST & BUILD VERIFICATION (Runs for both Backend and Frontend)
  # ============================================================================
  build-and-verify:
    name: Build & Verify Fullstack App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- BACKEND VERIFICATION ---
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: 🧪 Verify Backend Architecture & Syntax
        working-directory: ./backend
        run: |
          node -e "
            try {
              require('./src/config');
              require('./src/routes');
              require('./src/services/brightdata.service');
              require('./src/services/vector.service');
              require('./src/services/rag.service');
              console.log('✅ Backend modules loaded successfully.');
            } catch (err) {
              console.error('❌ Backend module validation failed:', err);
              process.exit(1);
            }
          "

      # --- FRONTEND BUILD ---
      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🏗️ Compile Production Frontend Bundle (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: ✅ Build Integrity Passed
        run: echo "🚀 Fullstack verification completed with 0 errors!"

  # ============================================================================
  # 2. AUTOMATIC PRODUCTION DEPLOYMENT NOTIFICATION
  # ============================================================================
  notify-deploy:
    name: Cloud Deployment Sync
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Deploy Status Summary
        run: |
          echo "========================================================"
          echo "🎉 All CI checks passed on 'main' branch!"
          echo "⚡ Vercel: Auto-deploying Frontend to https://docu-pulse-ai.vercel.app"
          echo "🚀 Render: Auto-deploying Backend to https://docupulse-ai.onrender.com"
          echo "========================================================"
